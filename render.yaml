# OPSIYONEL — Render Blueprint tanimi.
#
# Blueprint ozelligi Render'da ucretli plan gerektirir. Ucretsiz katmanda kurulum
# icin bu dosyaya IHTIYACINIZ YOK: README bolum 4'teki "New > Web Service" adimlarini
# izleyin, oradaki alanlar bu dosyadakilerle aynidir.
#
# Ucretli bir plandaysaniz: New > Blueprint > bu repoyu sec. Dosya deponun kokunde
# olmalidir. Isaretli (sync: false) degiskenler panelden elle istenir; gizli degerler
# bilerek burada tutulmuyor.
services:
  - type: web
    name: outlook-mcp
    runtime: node
    # plan: free -> uyur ama bedava; starter -> uyumaz, ucretli.
    plan: free
    region: frankfurt
    # rootDir yok: bu dosya deponun kokunde duruyor ve sunucu da kokte.
    # Eger bu klasoru daha buyuk bir deponun alt klasoru olarak commit'lerseniz
    # render.yaml'i deponun kokune tasiyip buraya `rootDir: <klasor-adi>` ekleyin;
    # Render blueprint'i yalnizca depo kokunde arar.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: MCP_MAILBOXES
        sync: false
      - key: MCP_LOOKBACK_DAYS
        value: "730"
      - key: MCP_ALLOW_SEND
        value: "false"
